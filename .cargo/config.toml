# Static CRT: loom.exe runs without the MinGW runtime DLLs next to it.
# build.ps1 points LIBRARY_PATH at .cargo/libstub: w64devkit's libgcc.a
# already contains the SEH unwinder, so an empty libgcc_eh.a satisfies rustc.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
