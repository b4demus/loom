[package]
name = "loom"
description = "loom DAW"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
asio = ["cpal/asio", "dep:asio-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loom-engine = { path = "../engine" }
loom-host = { path = "../host" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
rtrb = "0.3"
hound = "3.5"
asio-sys = { version = "0.4", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
