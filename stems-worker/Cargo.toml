[package]
name = "loom-stems"
version.workspace = true
edition.workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
loom-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
